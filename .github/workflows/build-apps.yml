name: Build CHICKEN GUN apps

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - "package.json"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CHICKEN-GUN-ANDROID-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Build Windows installer and portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install desktop packaging tools
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build Windows app
        run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: CHICKEN-GUN-WINDOWS-EXE
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
